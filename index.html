<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初见·苏师 | 2026级新生校园指南</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231d4ed8' d='M12 3 3 8v2.5c0 5.2 3.6 9.7 9 11.5 5.4-1.8 9-6.3 9-11.5V8z'/%3E%3Cpath fill='%23fff' d='M8 12.5l3 3 5-5'/%3E%3C/svg%3E">
<script>
/* 小慧头像兜底：PNG 加载失败时替换为手绘 SVG */
window.__msvg=function(cls){return '<svg class="'+cls+'" viewBox="0 0 64 64" aria-label="小慧"><circle cx="16" cy="13" r="7.5" fill="#3a2e2a"/><circle cx="48" cy="13" r="7.5" fill="#3a2e2a"/><path d="M9 13l-2 8M55 13l2 8" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/><circle cx="32" cy="37" r="21" fill="#ffe3d3"/><path d="M11 37c0-13 9-23 21-23s21 10 21 23c-3-9-4-12-8-13 1 3 1 4 1 5-4-6-9-9-14-9s-11 3-14 9c0-1 0-2 1-5-4 1-5 4-8 13z" fill="#3a2e2a"/><circle cx="25" cy="38" r="2.4" fill="#3a2e2a"/><circle cx="39" cy="38" r="2.4" fill="#3a2e2a"/><circle cx="20" cy="43" r="2.6" fill="#fca5a5" opacity=".7"/><circle cx="44" cy="43" r="2.6" fill="#fca5a5" opacity=".7"/><path d="M27 45q5 4 10 0" stroke="#3a2e2a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';};
window.__merr=function(img){img.outerHTML=window.__msvg(img.className);};
</script>
<style>
:root{
  --bg:#eef4fd;--card:#ffffff;--line:#dbe6f5;--ink:#1c2b3a;--muted:#5b6b7c;
  --brand:#1d4ed8;--brand-2:#1e40af;--brand-soft:#e3edff;
  --accent:#f59e0b;--accent-2:#ea580c;--accent-soft:#fff7e8;
  --ok:#16a34a;--bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.view{display:none;min-height:100vh}
.view.active{display:block;animation:fadeUp .38s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
hl{color:var(--brand);font-weight:700}
wn{color:var(--bad);font-weight:700}
button{font-family:inherit}
img{user-select:none}

/* ============ 第一层：封面页 ============ */
.cover{position:relative;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,#d8e8ff 0%,#e9f2ff 52%,#f6faff 100%)}
.cover.active{display:flex}
.cover-leave{opacity:0;transform:scale(1.04);transition:opacity .36s ease,transform .36s ease;pointer-events:none}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cloud{animation:drift 16s ease-in-out infinite alternate}
.cloud.c2{animation-duration:21s;animation-delay:-6s}
.cloud.c3{animation-duration:26s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.cover-inner{position:relative;z-index:2;padding:0 24px;max-width:640px}
.cover-kicker{display:inline-block;font-size:12px;letter-spacing:4px;color:var(--brand);border:1px solid #b9cff5;border-radius:999px;padding:5px 16px;background:rgba(255,255,255,.72);margin-bottom:18px}
.cover h1{font-size:46px;font-weight:900;letter-spacing:8px;line-height:1.2;
  background:linear-gradient(120deg,var(--brand-2) 20%,var(--brand) 55%,var(--accent-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cover h1 .dot{color:var(--accent);-webkit-text-fill-color:var(--accent)}
.cover-sub{margin-top:10px;font-size:17px;letter-spacing:7px;color:var(--brand-2);font-weight:700}
.cover-desc{margin:16px auto 0;color:var(--muted);font-size:14px;max-width:420px}
.btn-enter{margin-top:30px;display:inline-flex;align-items:center;gap:10px;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;
  font-size:16px;font-weight:800;letter-spacing:3px;padding:15px 40px;border-radius:999px;
  box-shadow:0 10px 26px rgba(234,88,12,.32);transition:transform .18s,box-shadow .18s}
.btn-enter:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(234,88,12,.4)}
.btn-enter svg{transition:transform .18s}
.btn-enter:hover svg{transform:translateX(4px)}
.cover-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;color:var(--brand);opacity:.65;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
.cover-mascot{position:absolute;right:18px;bottom:54px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cover-mascot img,.cover-mascot svg{height:150px;width:auto;filter:drop-shadow(0 8px 16px rgba(30,64,175,.22))}
.cm-tip{background:#fff;border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:6px 12px;font-size:12px;color:var(--brand-2);box-shadow:0 4px 14px rgba(30,64,175,.1)}

/* ============ 公共顶栏 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--brand-2)}
.brand .logo{width:26px;height:26px}
.topbar .src{font-size:12px;color:var(--muted)}

/* ============ 第二层：导览界面 ============ */
.agent-card{margin:20px 0 6px;display:flex;gap:14px;align-items:center;border-radius:20px;padding:18px 20px;color:#fff;
  background:linear-gradient(120deg,var(--brand-2) 0%,var(--brand) 60%,#3b82f6 100%);
  box-shadow:0 12px 28px rgba(29,78,216,.24);position:relative;overflow:hidden}
.agent-card::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.ac-img{height:104px;width:auto;flex:none;position:relative;z-index:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
.ac-txt{position:relative;z-index:1;min-width:0}
.ac-name{font-size:18px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.ac-tag{font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:1px}
.ac-desc{font-size:13px;opacity:.92;margin:6px 0 10px}
.ac-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ac-chip{font-size:12px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 11px;cursor:pointer}
.ac-chip:hover{background:rgba(255,255,255,.28)}
.ac-go{background:#fff;color:var(--brand);border:none;border-radius:999px;font-size:13px;font-weight:800;padding:8px 20px;cursor:pointer}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px;font-size:19px;font-weight:900;color:var(--brand-2)}
.sec-title span{font-size:12px;color:var(--muted);font-weight:400}
.mod-grid{display:grid;grid-template-columns:1fr;gap:13px;padding-bottom:26px}
.mod-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;
  display:flex;gap:13px;align-items:flex-start;transition:transform .16s,border-color .16s,box-shadow .16s;text-decoration:none;color:inherit}
.mod-card:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px rgba(29,78,216,.1)}
.mod-card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft)}
.mod-card h3{font-size:16px;font-weight:800}
.mod-card p{font-size:13px;color:var(--muted);margin-top:2px}
.mod-card .ixtag{display:inline-block;margin-top:8px;font-size:11px;color:var(--accent-2);background:var(--accent-soft);border:1px solid #fde3b8;border-radius:999px;padding:2px 10px;font-weight:700}
footer{padding:24px 0 34px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
footer .note{margin-top:5px;font-size:11px;opacity:.75}

/* ============ 第三层：分区详情 ============ */
.d-head{display:flex;align-items:center;gap:12px;padding:20px 0 6px}
.back{flex:none;width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.back:hover{background:var(--brand-soft)}
.d-head h2{font-size:22px;font-weight:900;color:var(--brand-2)}
.d-sub{font-size:13px;color:var(--muted);margin-top:1px}
.sec-block{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:13px}
.sec-block h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--ink)}
.sec-block .lead{font-size:14px;color:var(--muted);margin-bottom:12px}
.points{display:grid;grid-template-columns:1fr;gap:10px}
.point{background:#f6f9fe;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px}
.point b{color:var(--brand);font-weight:700}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin-top:4px}
.tbl th,.tbl td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:#f2f6fc;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tel-line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.tel-line:last-child{border-bottom:none}
.copy{flex:none;font-size:12px;color:var(--brand);border:1px solid #b9cff5;background:var(--brand-soft);border-radius:8px;padding:4px 12px;cursor:pointer}

/* 互动卡片（橙色主题） */
.ix-card{background:linear-gradient(180deg,#fffdf6 0%,#fff 70%);border:1.5px solid #fcd34d;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 6px 18px rgba(245,158,11,.1)}
.ix-card .ix-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ix-pill{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2));border-radius:999px;padding:3px 10px;letter-spacing:2px}
.ix-card h3{font-size:17px;font-weight:900;color:var(--accent-2)}
.ix-card .ix-sub{font-size:13px;color:var(--muted);margin-bottom:12px}

/* 闯关 */
.quest{position:relative;padding-left:30px}
.quest::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:0;border-left:2px dashed #f3c26b}
.qnode{position:relative;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:border-color .2s,background .2s}
.qnode .qn-dot{position:absolute;left:-26px;top:14px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #f3c26b;color:var(--accent-2);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.qnode.done{border-color:#fdba3b;background:#fffcf2}
.qnode.done .qn-dot{background:var(--accent);border-color:var(--accent);color:#fff}
.qn-t{font-weight:800;font-size:15px;margin-bottom:5px}
.qn-tasks{font-size:13.5px;color:var(--muted);line-height:1.8}
.qn-btn{margin-top:9px;font-size:13px;font-weight:700;border-radius:9px;border:1.5px solid var(--accent);background:#fff;color:var(--accent-2);padding:6px 16px;cursor:pointer;transition:all .15s}
.qn-btn:hover{background:var(--accent-soft)}
.qn-btn[disabled]{border-color:var(--ok);color:var(--ok);background:#f0fdf4;cursor:default}
.quest-bar{font-size:13px;color:var(--muted);margin-bottom:12px}
.quest-bar b{color:var(--accent-2)}
.quest-win{display:none;text-align:center;padding:16px 8px 6px}
.quest-win.show{display:block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.quest-win .badge{width:74px;height:74px;margin:0 auto 8px}
.quest-win .wt{font-size:18px;font-weight:900;color:var(--accent-2);letter-spacing:2px}
.quest-win .ws{font-size:13px;color:var(--muted)}

/* 测验通用 */
.quiz-q{margin-bottom:15px}
.quiz-q .q{font-size:15px;font-weight:700;margin-bottom:9px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.qopt:hover{border-color:var(--accent)}
.qopt.sel-ok{border-color:var(--ok);background:#ecfdf3}
.qopt.sel-bad{border-color:var(--bad);background:#fef2f2}
.qopt.sel-pick{border-color:var(--accent);background:var(--accent-soft)}
.qopt.disabled{pointer-events:none;opacity:.78}
.qfb{font-size:13px;margin-top:8px;padding:9px 12px;border-radius:10px;display:none}
.qfb.show{display:block}
.qfb.ok{background:#ecfdf3;color:#166534}
.qfb.bad{background:#fef2f2;color:#991b1b}
.quiz-out{display:none;margin-top:6px;border-radius:14px;padding:15px;background:var(--accent-soft);border:1px solid #fde3b8;font-size:14px}
.quiz-out.show{display:block;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.quiz-out .stars{font-size:19px;letter-spacing:4px;color:var(--accent);font-weight:900}
.quiz-out b{color:var(--accent-2)}
.redo{margin-top:10px;font-size:13px;font-weight:700;border:1.5px solid var(--accent);background:#fff;color:var(--accent-2);border-radius:9px;padding:6px 16px;cursor:pointer}

/* 地点速查 */
.map-tabs{display:flex;gap:8px;margin-bottom:12px}
.mtab{flex:1;text-align:center;font-size:14px;font-weight:700;padding:9px 0;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s}
.mtab.on{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pin{display:flex;align-items:center;gap:8px;text-align:left;font-size:13.5px;font-weight:700;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:all .15s;color:var(--ink)}
.pin:hover{border-color:var(--accent)}
.pin.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.pin svg{flex:none}
.pin-card{display:none;margin-top:12px;background:#fff;border:1px solid #fde3b8;border-radius:13px;padding:13px 14px;font-size:14px}
.pin-card.show{display:block;animation:fadeUp .25s ease}
.pin-card .pc-t{font-weight:800;color:var(--accent-2);margin-bottom:4px}

/* 食堂 */
.rand-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(245,158,11,.3)}
.rand-out{margin-top:12px;background:#fff;border:1px solid #fde3b8;border-radius:12px;padding:13px 15px;font-size:14.5px;display:none}
.rand-out.show{display:block;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.rand-out b{color:var(--accent-2)}
.taste-row{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.taste{flex:1;min-width:90px;text-align:center;font-size:14px;font-weight:700;padding:10px 0;border-radius:11px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);transition:all .15s}
.taste.on,.taste:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}

/* 心情晴雨表 */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .15s}
.mood:hover{border-color:var(--accent);transform:translateY(-2px)}
.mood .mi{width:44px;height:44px;margin:0 auto 6px}
.mood .mt{font-size:14px;font-weight:800}
.mood-out{display:none;margin-top:13px;background:#fff;border:1px solid #fde3b8;border-radius:13px;padding:14px;font-size:14px}
.mood-out.show{display:block;animation:fadeUp .3s ease}
.hotline{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#eff6ff;border:1px solid #b9cff5;color:var(--brand);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700}

/* ============ 小慧聊天 ============ */
.chat-wrap{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.chat-ava{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.chat-ava img,.chat-ava svg{width:100%;height:100%;object-fit:cover}
.ch-name{font-weight:900;font-size:16px;color:var(--brand-2)}
.ch-status{font-size:11.5px;color:var(--ok);display:flex;align-items:center;gap:4px}
.ch-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat-body{flex:1;overflow-y:auto;padding:14px 14px 6px}
.msg{display:flex;gap:8px;margin-bottom:13px;align-items:flex-start}
.msg .avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--line);flex:none}
.msg .avatar img,.msg .avatar svg{width:100%;height:100%;object-fit:cover}
.bubble{max-width:80%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.75;word-break:break-word}
.msg.bot .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--brand);color:#fff;border-top-right-radius:4px}
.bubble .rbox{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.bubble .rt{font-size:12px;color:var(--muted);margin-bottom:6px}
.rchip{display:inline-block;font-size:12.5px;color:var(--brand);background:var(--brand-soft);border:1px solid #b9cff5;border-radius:999px;padding:3px 11px;margin:0 6px 6px 0;cursor:pointer}
.warn-card{border:1px solid #fcd34d;background:#fffbeb;border-radius:10px;padding:9px 11px;margin-top:9px;font-size:13px;color:#92400e;line-height:1.7}
.care-card{border:1px solid #bfdbfe;background:#eff6ff;border-radius:10px;padding:9px 11px;margin-top:9px;font-size:13px;color:#1e40af;line-height:1.8}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#b6c6dd;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chat-chips{display:flex;gap:7px;padding:8px 14px;overflow-x:auto;background:var(--bg);flex:none}
.chat-chips::-webkit-scrollbar{display:none}
.cchip{flex:none;font-size:12.5px;color:var(--brand-2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.cchip:hover{border-color:var(--brand)}
.chat-input{display:flex;gap:9px;padding:11px 14px 14px;background:#fff;border-top:1px solid var(--line);flex:none}
.chat-input input{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;font-size:15px;outline:none}
.chat-input input:focus{border-color:var(--brand)}
.chat-input button{flex:none;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:0 22px;font-size:15px;font-weight:800;cursor:pointer}
.chat-input button:disabled{opacity:.5}

/* ============ 图集 & 灯箱 & 工具 ============ */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(238,244,253,.97),rgba(238,244,253,.86));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in;transition:transform .16s,box-shadow .16s}
.gal figure:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(29,78,216,.13)}
.gal img{display:block;width:100%;height:116px;object-fit:cover;background:#eef4fd}
.gal figcaption{font-size:11.5px;color:var(--muted);padding:6px 8px;line-height:1.45;border-top:1px solid var(--line);background:#fbfdff}
.gal.tall img{height:168px}
.gal-note{font-size:12px;color:var(--muted);margin-top:8px}
.sec-block h3 .cap{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.lbox{position:fixed;inset:0;z-index:120;background:rgba(10,20,38,.88);display:none;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lbox.show{display:flex;animation:fadeUp .22s ease}
.lbox img{max-width:96vw;max-height:84vh;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.55);background:#0b1526}
.lbox .lcap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:7px 16px;border-radius:999px;max-width:90vw;text-align:center}
.lbox .lx{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.lbox .lx:hover{background:rgba(255,255,255,.32)}
.step{display:flex;gap:9px;margin:6px 0;font-size:14px}
.step .sn{flex:none;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stepp{margin-top:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.to-top{position:fixed;right:16px;bottom:18px;z-index:60;width:44px;height:44px;border-radius:50%;border:none;background:var(--brand);color:#fff;box-shadow:0 8px 22px rgba(29,78,216,.36);cursor:pointer;display:none;align-items:center;justify-content:center}
.to-top.show{display:flex}
@media (min-width:768px){
  .cover h1{font-size:64px;letter-spacing:12px}
  .cover-sub{font-size:20px}
  .mod-grid{grid-template-columns:repeat(2,1fr)}
  .points{grid-template-columns:1fr 1fr}
  .pins{grid-template-columns:repeat(3,1fr)}
  .cover-mascot img,.cover-mascot svg{height:190px}
  .cover-mascot{right:6%;bottom:70px}
  .gal{grid-template-columns:repeat(4,1fr)}
  .gal img{height:132px}
  .gal.tall img{height:186px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 图文内联（figs）· 地图 · 去AI味微调 ===== */
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:13px 0 3px}
.figs.n1{grid-template-columns:1fr}
.figs.n3{grid-template-columns:repeat(3,1fr)}

.figs figure:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,40,80,.1)}
.figs img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef3fb}
.figs figcaption{font-size:11.5px;color:var(--muted);padding:6px 8px;text-align:center;line-height:1.45}
.body-txt{font-size:14px;color:var(--ink);line-height:1.78}
.map-hero{margin:0 0 12px}
.map-hero img{display:block;width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.map-cap{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px}

.agent-card{background:linear-gradient(135deg,#233f97 0%,#1d4ed8 100%);box-shadow:0 10px 24px rgba(29,78,216,.2)}
.cover h1{letter-spacing:6px}
.sec-block h3{letter-spacing:.2px}

  var fb=function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){btn.textContent='复制失败';}document.body.removeChild(ta);};

function openModule(id){

  for(var i=0;i<MODULES.length;i++)if(MODULES[i].id===id)m=MODULES[i];
  if(!m)return;
  el('d-title').textContent=m.name;
  el('d-sub').textContent=m.desc+' · 互动：'+m.ixt;
  el('d-ix').innerHTML='';
  el('d-body').innerHTML=m.blocks.map(renderBlock).join('');
  show('view-detail');
  if(IX[id])IX[id]();
}

/* ===== 通用：单选测验（答对/答错即时反馈） ===== */
function buildQuiz(box,qs,resultHTML){
  var done=qs.map(function(){return -1;});
  box.innerHTML='<div class="quiz">'+qs.map(function(q,qi){
    return '<div class="quiz-q" data-qi="'+qi+'"><div class="q">'+(qi+1)+'. '+q.q+'</div><div class="qopts">'
      +q.opts.map(function(o,oi){return '<button type="button" class="qopt" data-oi="'+oi+'">'+o+'</button>';}).join('')
      +'</div><div class="qfb"></div></div>';
  }).join('')+'<div class="quiz-out"></div></div>';
  function lock(){
    for(var i=0;i<done.length;i++)if(done[i]<0)return;
    var sc=0;for(var j=0;j<qs.length;j++)if(done[j]===qs[j].a)sc++;
    var out=box.querySelector('.quiz-out');
    out.className='quiz-out show';
    out.innerHTML=resultHTML(sc,qs.length);
    var rb=document.createElement('button');rb.type='button';rb.className='redo';rb.textContent='再来一次 ↻';
    rb.onclick=function(){buildQuiz(box,qs,resultHTML);};
    out.appendChild(rb);
  }
  var btns=box.querySelectorAll('.qopt');
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener('click',function(){
      var qd=this.parentNode.parentNode;
      var qi=+qd.getAttribute('data-qi');
      if(done[qi]>=0)return;
      var oi=+this.getAttribute('data-oi');
      done[qi]=oi;
      var all=qd.querySelectorAll('.qopt');
      for(var i=0;i<all.length;i++){
        all[i].className='qopt disabled';
        if(i===qs[qi].a)all[i].classList.add('sel-ok');
      }
      if(oi!==qs[qi].a)this.className='qopt disabled sel-bad';
      var fb=qd.querySelector('.qfb');
      fb.className='qfb show '+(oi===qs[qi].a?'ok':'bad');
      fb.textContent=(oi===qs[qi].a?'答对啦：':'差一点：')+qs[qi].tip;
      lock();
    });
  }
}

/* 危机关键词：最高优先级 */
var CRISIS_RE=/不想活|想死|自杀|活不下去|结束生命|自残|轻生|不想存在|了断|割腕|跳楼/;
/* 诈骗相关提问：回答时追加防骗卡 */
var FRAUD_RE=/转账|汇款|验证码|银行卡密码|屏幕共享|刷单|贷款|助学金|退款|客服|收费|手续费|保证金/;

/* 匹配：命中关键词计分，长词权重高 */
function findAnswer(q){
  var best=null,score=0;
  for(var i=0;i<KB.length;i++){
    var s=0,e=KB[i];
    for(var j=0;j<e.k.length;j++){
      if(q.indexOf(e.k[j])>=0)s+=e.k[j].length>=3?2:1;
    }
    if(s>score){score=s;best=e;}
  }
  return best;
}

/* ===== 聊天渲染 ===== */
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bubble(who,html){
  var d=document.createElement('div');d.className='msg '+who;
  d.innerHTML=(who==='bot'?'<div class="avatar">'+mimg('')+'</div>':'')
    +'<div class="bubble">'+html+'</div>';
  el('chat-body').appendChild(d);
  el('chat-body').scrollTop=el('chat-body').scrollHeight;
  return d;
}
function typing(){
  var d=document.createElement('div');d.className='msg bot';d.id='typing-row';
  d.innerHTML='<div class="avatar">'+mimg('')+'</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  el('chat-body').appendChild(d);
  el('chat-body').scrollTop=el('chat-body').scrollHeight;
}
function untype(){var t=el('typing-row');if(t)t.parentNode.removeChild(t);}

function setSend(on){el('chat-send').disabled=!on;if(on)el('chat-q').focus();}

function askBot(raw){
  var q=(raw||el('chat-q').value);
  q=(q||'').replace(/\s+/g,'').trim();
  if(!q)return;
  el('chat-q').value='';
  bubble('user',esc(q));
  setSend(false);
  typing();
  setTimeout(function(){
    untype();
    var html='';
    if(CRISIS_RE.test(q)){
      html='先谢谢你愿意把这么难的感受说出来。你现在的安全最重要，请<hl>不要独处</hl>，立刻联系一个你信任的人，或直接拨打：<br>· 校内 24h 阳光心理热线 <hl>19852059689</hl><br>· 全国统一心理援助热线 <hl>12356</hl><br>· 紧急危险拨打 <hl>120 / 110</hl><br>也可以马上到泉山 32 号楼心理中心或就近找辅导员、宿管。'+CARE;
      bubble('bot',html);
    }else{
      var e=findAnswer(q);
      if(!e){
        var tips=['快递在哪里取？','军训几号开始？','助学贷款怎么办？','24小时心理热线是多少？'];
        html='这个问题我在官方指南里没找到确切答案，就不瞎编啦～你可以换个问法，或咨询辅导员/学校官方通知。先试试这些：'
          +'<div class="rbox"><div class="rt">大家常问：</div>'+tips.map(function(t){return '<span class="rchip" onclick="goAsk(\''+t+'\')">'+t+'</span>';}).join('')+'</div>';
      }else{
        html=e.a;
        if(FRAUD_RE.test(q)&&html.indexOf('warn-card')<0)html+=WARN;
        if(e.rel&&e.rel.length){
          html+='<div class="rbox"><div class="rt">你可能还想问：</div>'
            +e.rel.map(function(t){return '<span class="rchip" onclick="goAsk(\''+t+'\')">'+t+'</span>';}).join('')+'</div>';
        }
      }
      bubble('bot',html);
    }
    setSend(true);
  },520);
}
function goAsk(q){el('chat-q').value=q;askBot(q);}

/* ===== 图集灯箱 & 回到顶部 ===== */
function openLbox(src,cap){el('lbox-img').src=src;el('lbox-cap').textContent=cap||'';el('lbox').classList.add('show');document.body.style.overflow='hidden';}
function closeLbox(){el('lbox').classList.remove('show');el('lbox-img').src='';document.body.style.overflow='';}
function bindChrome(){
  el('lbox').addEventListener('click',function(ev){if(ev.target===this||ev.target.id==='lbox-x')closeLbox();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeLbox();});
  var tt=el('to-top');
  tt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  window.addEventListener('scroll',function(){if(window.scrollY>640)tt.classList.add('show');else tt.classList.remove('show');});
}

/* ===== 初始化 ===== */
var QUICK=['军训几号开始？','助学贷款怎么办？','五元套餐在哪个食堂？','快递在哪里取？','24小时心理热线是多少？'];
function chipHTML(t){return '<span class="rchip" onclick="goAsk(\''+t+'\')">'+t+'</span>';}

function init(){
  renderNav();
  bindChrome();
  el('ac-chips').innerHTML=QUICK.slice(0,4).map(function(t){
    return '<button type="button" class="ac-chip" onclick="openChat();goAsk(\''+t+'\')">'+t+'</button>';
  }).join('');
  el('chat-chips').innerHTML=QUICK.map(function(t){
    return '<button type="button" class="cchip" onclick="goAsk(\''+t+'\')">'+t+'</button>';
  }).join('');

  el('btn-enter').addEventListener('click',function(){
    el('view-cover').classList.add('cover-leave');
    setTimeout(function(){
      show('view-nav');
      el('view-cover').classList.remove('cover-leave');
    },380);
  });
  el('btn-back').addEventListener('click',function(){show('view-nav');});
  el('btn-chat-back').addEventListener('click',function(){show('view-nav');});
  el('ac-go').addEventListener('click',openChat);

  el('chat-send').addEventListener('click',function(){askBot();});
  el('chat-q').addEventListener('keydown',function(ev){if(ev.key==='Enter')askBot();});

  bubble('bot','你好呀，我是小慧，你的校园向导～<br>九大分区的问题都可以问我：车票预约、军训防护、快递食堂、奖助贷、心理热线……答不上来我绝不瞎编。'
    +'<div class="rbox"><div class="rt">试试问我：</div>'+QUICK.slice(0,3).map(chipHTML).join('')+'</div>');
}
function openChat(){show('view-chat');setTimeout(function(){el('chat-q').focus();},100);}

init();
